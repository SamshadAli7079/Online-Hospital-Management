
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login - MediCare Hospital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f9fc;
            color: #222;
        }

        /* ================= NAVBAR ================= */

        nav {
            background: #0b7285;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 7%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #d9faff;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav ul li a:hover {
            color: #d9faff;
        }

        /* ================= LOGIN SECTION ================= */

        .login-section {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e9fbff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .login-box h1 {
            text-align: center;
            color: #075e6e;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd6da;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0b7285;
            box-shadow: 0 0 0 2px rgba(11,114,133,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0b7285;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #075e6e;
        }

        /* ================= MESSAGE ================= */

        .login-message {
            display: none;
            margin-bottom: 20px;
            padding: 13px;
            border-radius: 7px;
            text-align: center;
            background: #e7f8ed;
            color: #16803a;
            font-weight: bold;
        }

        /* ================= REGISTER LINK ================= */

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register-link a {
            color: #0b7285;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #063f4a;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        footer h3 {
            margin-bottom: 10px;
        }

        footer p {
            color: #d7eef1;
            margin: 6px 0;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

        }

        @media (max-width: 600px) {

            .login-section {
                padding: 40px 15px;
            }

            .login-box {
                padding: 30px 22px;
            }

            .login-box h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            🏥 MediCare <span>Hospital</span>
        </div>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="doctors.html">
                    Doctors
                </a>
            </li>

            <li>
                <a href="appointment.html">
                    Appointment
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= LOGIN ================= -->

    <section class="login-section">

        <div class="login-box">

            <div class="login-icon">
                👤
            </div>

            <h1>
                Patient Login
            </h1>

            <p class="login-subtitle">
                Login to access your patient dashboard
            </p>


            <div
                id="loginMessage"
                class="login-message"
            >
                Login successful!
            </div>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    🔐 Login

                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Register Now
                </a>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            🏥 MediCare Hospital
        </h3>

        <p>
            Online Hospital Management System
        </p>

        <p>
            © 2026 MediCare Hospital. All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                try {

                    const response =
                        await fetch(
                            "https://hospital-management-api-2fqs.onrender.com/api/patients/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (response.ok) {

                        loginMessage.textContent =
                            "✅ Login successful!";

                        loginMessage.style.display =
                            "block";


                        /* Save patient information */

                        localStorage.setItem(
                            "patient",
                            JSON.stringify(
                                data.patient
                            )
                        );


                        /* Open patient dashboard */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "patient-dashboard.html";

                            },
                            1000
                        );


                    } else {

                        alert(
                            data.message ||
                            "Invalid email or password"
                        );

                    }


                } catch (error) {

                    console.log(
                        "Login Error:",
                        error
                    );

                    alert(
                        "Backend server se connection nahi ho raha hai."
                    );

                }

            }
        );

    </script>


</body>

</html>
